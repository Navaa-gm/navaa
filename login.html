<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود / ثبت‌نام | Navaa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--black); margin: 0; padding: 1rem; position: relative; }
    .back-home-btn { position: absolute; top: 1.5rem; right: 1.5rem; color: var(--text-dim); text-decoration: none; font-size: 0.9rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; border-radius: 10px; transition: 0.2s; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); }
    .back-home-btn:hover { color: #fff; background: rgba(255,255,255,0.08); border-color: var(--turquoise); }
    .auth-container { background: var(--black-2); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; width: 100%; max-width: 400px; box-shadow: 0 0 40px rgba(0,240,212,0.1); }
    .auth-tabs { display: flex; background: var(--black-3); border-radius: 12px; padding: 0.3rem; margin-bottom: 2rem; }
    .auth-tab { flex: 1; padding: 0.8rem; background: transparent; border: none; color: var(--text-dim); font-family: inherit; font-weight: 700; border-radius: 10px; cursor: pointer; transition: 0.3s; }
    .auth-tab.active { background: linear-gradient(135deg, var(--turquoise), var(--sky)); color: #001a1c; }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .auth-form h2 { color: #fff; font-size: 1.2rem; margin-bottom: 0.5rem; text-align: center; }
    .auth-sub { color: var(--text-dim); font-size: 0.85rem; text-align: center; margin-bottom: 1.5rem; }
    .auth-form label { display: block; color: #fff; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.5rem; }
    .auth-form input { width: 100%; padding: 0.9rem; background: var(--black-3); border: 1px solid var(--border); border-radius: 10px; color: #fff; font-family: inherit; font-size: 0.95rem; margin-bottom: 1rem; outline: none; transition: 0.2s; box-sizing: border-box; }
    .auth-form input:focus { border-color: var(--turquoise); box-shadow: 0 0 10px rgba(0,240,212,0.2); }
    .auth-form .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; color: var(--text-dim); font-size: 0.8rem; }
    .btn-primary.full { width: 100%; padding: 1rem; font-size: 1rem; margin-top: 0.5rem; }
    .auth-switch { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-dim); }
    .auth-switch a { color: var(--turquoise); text-decoration: none; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <a href="home.html" class="back-home-btn">🏠 بازگشت به صفحه اصلی</a>

  <div class="auth-container">
    <div class="auth-tabs">
      <button class="auth-tab active" data-target="login">ورود</button>
      <button class="auth-tab" data-target="signup">ساخت حساب</button>
    </div>

    <form id="loginForm" class="auth-form active">
      <h2>خوش برگشتی 👋</h2>
      <p class="auth-sub">وارد حساب Navaa خودت شو</p>
      <label>ایمیل</label>
      <input type="email" name="email" required placeholder="you@example.com">
      <label>رمز عبور</label>
      <input type="password" name="password" required placeholder="••••••">
      <button type="submit" class="btn-primary full">🚀 ورود</button>
      <p class="auth-switch">حساب نداری؟ <a onclick="switchTab('signup')">ثبت‌نام کن</a></p>
    </form>

    <form id="signupForm" class="auth-form">
      <h2>به Navaa خوش اومدی ✨</h2>
      <p class="auth-sub">برای ساخت حساب، اطلاعاتت رو وارد کن</p>
      <label>نام و نام خانوادگی</label>
      <input type="text" name="fullname" required placeholder="مثلاً علی رضایی">
      <label>ایمیل <span style="color:#ff2e4d;">*</span></label>
      <input type="email" name="email" required placeholder="you@example.com">
      <label>شماره تماس <span style="color:#a0a0a0;font-size:.75rem;">(اختیاری)</span></label>
      <input type="tel" name="phone" placeholder="09123456789" pattern="[0-9]{11}">
      <label>رمز عبور</label>
      <input type="password" name="password" required minlength="4" placeholder="حداقل ۴ کاراکتر">
      <label class="checkbox-row">
        <input type="checkbox" name="terms" required>
        <span>قوانین Navaa رو می‌پذیرم</span>
      </label>
      <button type="submit" class="btn-primary full">✨ ساخت حساب</button>
      <p class="auth-switch">حساب داری؟ <a onclick="switchTab('login')">وارد شو</a></p>
    </form>
  </div>

  <script>
    const CURRENT_KEY = 'navaa_current_user';
    const USERS_KEY = 'navaa_users';
    const ADMIN_EMAIL = 'm.soroush.salari@gmail.com';

    window.switchTab = function(tabName) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      const tabBtn = document.querySelector(`.auth-tab[data-target="${tabName}"]`);
      const form = document.getElementById(tabName === 'login' ? 'loginForm' : 'signupForm');
      if (tabBtn) tabBtn.classList.add('active');
      if (form) form.classList.add('active');
    };

    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', (e) => { e.preventDefault(); switchTab(tab.dataset.target); });
    });

    // 🔥 ورود: الان از دیتابیس ابری هم می‌خونه تا از هر مرورگری کار کنه
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email = e.target.email.value.trim().toLowerCase();
      const password = e.target.password.value;

      let users = [];
      try {
        if (window.getUsersFromCloud) {
           users = await window.getUsersFromCloud(); // گرفتن لیست از سرور
        } else {
           users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
        }
      } catch (err) {
         users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
      }

      const user = users.find(u => (u.email || '').toLowerCase() === email && u.password === password);

      if (!user) return alert('❌ ایمیل یا رمز عبور اشتباهه!');
      if (user.banned === true) return alert('🚫 حساب شما مسدود شده!');

      localStorage.setItem(CURRENT_KEY, JSON.stringify(user));
      window.location.href = 'gallery.html';
    });

    // 🔥 ثبت‌نام: لیست از سرور میاد، اضافه میشه و دوباره ذخیره میشه
    document.getElementById('signupForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email = e.target.email.value.trim().toLowerCase();
      const phone = e.target.phone.value.trim();
      const fullname = e.target.fullname.value.trim();
      const password = e.target.password.value;

      let users = [];
      try {
        if (window.getUsersFromCloud) {
           users = await window.getUsersFromCloud(); 
        } else {
           users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
        }
      } catch(err) {
         users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
      }

      if (users.find(u => (u.email || '').toLowerCase() === email)) return alert('❌ این ایمیل قبلاً ثبت‌نام کرده!');
      if (phone && users.find(u => u.phone === phone)) return alert('❌ این شماره قبلا ثبت‌نام کرده!');

      const isAdminSignup = email === ADMIN_EMAIL;
      const newUser = {
        id: Date.now(), fullname, phone: phone || null, email, password,
        hasSubscription: isAdminSignup, subscriptionPlan: isAdminSignup ? 'diamond' : null,
        subscriptionExpiry: isAdminSignup ? Date.now() + (36500 * 24 * 60 * 60 * 1000) : null,
        joinDate: Date.now(), role: isAdminSignup ? 'admin' : 'user',
        balance: isAdminSignup ? 5000000 : 0, banned: false, purchasedItems: []
      };

      users.push(newUser);
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
      
      try {
        if (window.saveToCloud) {
          await window.saveToCloud(USERS_KEY, JSON.stringify(users));
          console.log('✅ کاربر با موفقیت روی سرور ذخیره شد');
        } else {
          throw new Error("تابع اتصال به سرور لود نشده است!");
        }
      } catch (err) {
        console.error(err);
        alert('⚠️ خطا در اتصال به دیتابیس ابری:\n' + err.message);
        return; // جلوگیری از ورود در صورت خطا
      }
      
      localStorage.setItem(CURRENT_KEY, JSON.stringify(newUser));
      alert('✨ حساب با موفقیت ساخته شد!');
      window.location.href = 'gallery.html';
    });
  </script>

  <!-- 🔥 اتصال به Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCdy1XEUDrVdgmyrr2r5nnvxaIP6A6y294",
      authDomain: "navaa-409cb.firebaseapp.com",
      projectId: "navaa-409cb",
      storageBucket: "navaa-409cb.firebasestorage.app",
      messagingSenderId: "81312395623",
      appId: "1:81312395623:web:6dd187fdf063ce44fc3fc2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.saveToCloud = async function(key, value) {
      await setDoc(doc(db, 'navaa_storage', key), { value: value, updatedAt: Date.now() });
    };

    window.getUsersFromCloud = async function() {
      const snap = await getDoc(doc(db, 'navaa_storage', 'navaa_users'));
      if (snap.exists()) return JSON.parse(snap.data().value);
      return [];
    };

    async function syncOnLoad() {
        try {
            const snap = await getDoc(doc(db, 'navaa_storage', 'navaa_users'));
            if (snap.exists()) localStorage.setItem('navaa_users', snap.data().value);
        } catch(e) { console.error("خطا در سینک اولیه:", e); }
    }
    syncOnLoad();
  </script>
</body>
</html>
