<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت | Navaa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-header { position: relative; background: radial-gradient(ellipse at 30% 0%, rgba(0,240,212,.15), transparent 55%), radial-gradient(ellipse at 70% 100%, rgba(56,189,248,.15), transparent 55%), linear-gradient(180deg, #0a0a0a 0%, #141414 100%); padding: 1.2rem 1.5rem; border-bottom: 1px solid rgba(0,240,212,.15); z-index: 10; }
    .admin-header::after { content: ''; position: absolute; bottom: 0; left: 5%; right: 5%; height: 2px; background: linear-gradient(90deg, transparent, var(--turquoise), var(--sky), var(--gold), var(--red), transparent); box-shadow: 0 0 12px var(--turquoise); }
    .admin-header-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .admin-logo-box { display: flex; align-items: center; gap: .5rem; text-decoration: none; }
    .admin-badge-large { display: inline-flex; align-items: center; gap: .4rem; background: linear-gradient(135deg, rgba(255,201,60,.15), rgba(255,140,0,.1)); border: 1px solid rgba(255,201,60,.5); color: var(--gold); padding: .5rem 1.1rem; border-radius: 999px; font-size: .82rem; font-weight: 800; box-shadow: 0 0 16px rgba(255,201,60,.3); }
    .admin-back-btn { display: inline-flex; align-items: center; gap: .5rem; background: linear-gradient(135deg, var(--turquoise), var(--sky)); color: #001a1c !important; text-decoration: none; padding: .8rem 1.5rem; border-radius: 999px; font-size: .92rem; font-weight: 800; box-shadow: 0 4px 20px rgba(0,240,212,.5); transition: all .25s; }
    .admin-back-btn:hover { transform: translateY(-2px) scale(1.02); }
    .admin-main { padding-bottom: 120px !important; }
    .admin-section { background: var(--black-2); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; max-width: 500px; }
    .admin-section h3 { margin: 0 0 1.2rem; font-size: 1rem; color: #fff; font-weight: 800; }
  </style>
</head>
<body>

  <header class="admin-header">
    <div class="admin-header-inner">
      <a href="gallery.html" class="admin-logo-box"><span class="logo-icon-sm">🎵</span><span class="logo-name-sm">Navaa<span class="dot">.</span></span></a>
      <div style="display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;">
        <span class="admin-badge-large">🛡️ پنل مدیریت</span>
        <a href="gallery.html" class="admin-back-btn"><span>رفتن به گالری</span></a>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <h1 class="admin-title">🛡️ پنل مدیریت Navaa</h1>
    <p class="admin-sub">مدیریت کاربران، آثار، پرداخت‌ها و برداشت‌ها</p>

    <div class="admin-stats">
      <div class="stat-box"><strong id="statUsers">0</strong><span>👥 کاربر</span></div>
      <div class="stat-box"><strong id="statAdmins">0</strong><span>🛡️ ادمین</span></div>
      <div class="stat-box"><strong id="statItems">0</strong><span>🖼️ اثر</span></div>
      <div class="stat-box"><strong id="statPending">0</strong><span>⏳ در انتظار</span></div>
      <div class="stat-box"><strong id="statCommission">0</strong><span>💰 درآمد مدیر</span></div>
    </div>

    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="users">👥 کاربران</button>
      <button class="admin-tab" data-tab="items">🖼️ آثار</button>
      <button class="admin-tab" data-tab="payments">💳 پرداخت‌ها</button>
      <button class="admin-tab" data-tab="withdraws">💸 برداشت‌ها</button>
      <button class="admin-tab" data-tab="settings">⚙️ تنظیمات</button>
    </div>

    <section id="tab-users" class="admin-panel">
      <div class="admin-search"><input type="text" id="userSearch" placeholder="🔍 جستجو..."></div>
      <div class="users-grid" id="usersGrid"></div>
    </section>

    <section id="tab-items" class="admin-panel hidden">
      <div class="admin-search"><input type="text" id="itemSearch" placeholder="🔍 جستجو در آثار..."></div>
      <div class="items-grid" id="adminItems"></div>
    </section>
    
    <section id="tab-payments" class="admin-panel hidden"><div id="paymentsList"></div></section>
    <section id="tab-withdraws" class="admin-panel hidden"><div id="withdrawsList"></div></section>

    <section id="tab-settings" class="admin-panel hidden">
      <div class="admin-section">
        <h3>⚙️ تنظیمات پلتفرم</h3>
        <div style="margin-bottom:1rem;"><label style="display:block;font-size:.85rem;color:#fff;margin-bottom:.4rem;font-weight:700;">درصد کمیسیون مدیر (٪):</label><input type="number" id="commissionInput" min="0" max="50" value="15" style="width:100%;padding:.7rem;background:var(--black-3);border:1px solid var(--border);border-radius:10px;color:#fff;font-family:inherit;font-size:.95rem;outline:none;"></div>
        <div style="margin-bottom:1rem;"><label style="display:block;font-size:.85rem;color:#fff;margin-bottom:.4rem;font-weight:700;">حداکثر قیمت اثر (تومان):</label><input type="number" id="maxPriceInput" min="10000" step="10000" value="500000" style="width:100%;padding:.7rem;background:var(--black-3);border:1px solid var(--border);border-radius:10px;color:#fff;font-family:inherit;font-size:.95rem;outline:none;"></div>
        <button id="saveSettingsBtn" class="btn-primary" style="padding:.8rem 1.5rem;">💾 ذخیره</button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <script>
    const CURRENT_KEY = 'navaa_current_user';
    const USERS_KEY = 'navaa_users';
    const ITEMS_KEY = 'navaa_items_v3';
    const ADMIN_EMAIL = 'm.soroush.salari@gmail.com';

    const adminData = { 
      id: 1, fullname: "M_Soroush_SF_86", email: ADMIN_EMAIL, phone: "09200914119", 
      role: "admin", hasSubscription: true, subscriptionPlan: "diamond", 
      balance: 5000000, joinDate: Date.now(), banned: false 
    };
    
    localStorage.setItem(CURRENT_KEY, JSON.stringify(adminData));
    let users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
    // اطمینان از وجود مدیر با اطلاعات درست
    users = users.filter(u => u.email !== ADMIN_EMAIL);
    users.push(adminData);
    localStorage.setItem(USERS_KEY, JSON.stringify(users));

    let items = JSON.parse(localStorage.getItem(ITEMS_KEY)) || [];
    
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
    function formatMoney(n) { return Number(n || 0).toLocaleString('fa-IR'); }
    function getInitials(name) { if (!name) return '؟'; const parts = name.trim().split(' '); return parts.length === 1 ? parts[0].charAt(0) : parts[0].charAt(0) + ' ' + parts[parts.length-1].charAt(0); }

    document.querySelectorAll('.admin-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.admin-panel').forEach(p => p.classList.add('hidden'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.remove('hidden');
      });
    });

    function updateStats() {
      document.getElementById('statUsers').textContent = users.length;
      document.getElementById('statAdmins').textContent = users.filter(u => u.role === 'admin').length;
      document.getElementById('statItems').textContent = items.length;
    }

    function renderUsers(search = '') {
      const grid = document.getElementById('usersGrid');
      grid.innerHTML = '';
      let sorted = [...users].sort((a, b) => b.joinDate - a.joinDate);
      if (search) sorted = sorted.filter(u => u.fullname.toLowerCase().includes(search) || u.email.toLowerCase().includes(search));
      
      if (sorted.length === 0) { grid.innerHTML = '<div class="empty-grid">کاربری پیدا نشد</div>'; return; }

      sorted.forEach(u => {
        const isSuper = u.email === ADMIN_EMAIL;
        const isUserAdmin = u.role === 'admin' || u.email === ADMIN_EMAIL;
        const isMe = u.id === adminData.id;
        
        let roleBadge = isSuper ? '<span class="role-badge role-super">👑 مدیر کل</span>' : (isUserAdmin ? '<span class="role-badge role-admin">🛡️ ادمین</span>' : '<span class="role-badge role-user">👤 کاربر</span>');
        let subBadge = u.hasSubscription ? `<span class="badge-yes">${ { bronze: '🥉 برنزی', silver: '🥈 طلایی', diamond: '💎 الماسی' }[u.subscriptionPlan] || '✅' }</span>` : '<span class="badge-no">❌ بدون اشتراک</span>';

        const card = document.createElement('div');
        card.className = 'user-card';
        card.innerHTML = `
          <div class="user-card-head">
            <div class="user-avatar">${escapeHtml(getInitials(u.fullname))}</div>
            <div class="user-main">
              <h4>${escapeHtml(u.fullname)} ${isMe ? '<small style="color:#00f0d4;">(شما)</small>' : ''}</h4>
              <div class="user-badges">${roleBadge}${subBadge}</div>
            </div>
          </div>
          <div class="user-info-grid">
            <div class="info-cell"><span>📞 شماره</span><strong dir="ltr">${escapeHtml(u.phone || '—')}</strong></div>
            <div class="info-cell"><span>📧 ایمیل</span><strong dir="ltr" style="font-size:.75rem;">${escapeHtml(u.email)}</strong></div>
            <div class="info-cell"><span>💰 موجودی</span><strong style="color:#ffc93c;">${formatMoney(u.balance || 0)}</strong></div>
            <div class="info-cell"><span>📅 عضویت</span><strong>${new Date(u.joinDate || Date.now()).toLocaleDateString('fa-IR')}</strong></div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderBottomNav() {
      const nav = document.getElementById('bottomNav'); if (!nav) return;
      let savedAvatar = localStorage.getItem('navaa_avatar_' + adminData.email);
      const profileContent = savedAvatar ? `<div class="profile-btn-avatar" style="background-image: url('${savedAvatar}');"></div>` : `<span class="nav-icon">👤</span>`;
      nav.innerHTML = `
        <button class="nav-pill-btn logout-pill" id="logoutNavBtn"><span class="nav-pill-icon">🚪</span><span class="nav-pill-label">خروج</span></button>
        <button class="nav-pill-btn sub-pill is-active" id="subNavBtn"><span class="nav-pill-icon">✨</span><span class="nav-pill-label">اشتراک فعال</span></button>
        <a href="profile.html" class="nav-center-profile ${savedAvatar ? 'has-avatar' : ''}" title="پروفایل">${profileContent}<span class="nav-center-label">پروفایل</span></a>
        <button class="nav-pill-btn admin-pill is-admin" id="adminNavBtn"><span class="nav-pill-icon">🛡️</span><span class="nav-pill-label">مدیر کل</span></button>
        <button class="nav-pill-btn upload-pill" id="uploadNavBtn"><span class="nav-pill-icon">➕</span><span class="nav-pill-label">آپلود اثر</span></button>
      `;
      nav.querySelector('#uploadNavBtn')?.addEventListener('click', () => window.location.href = 'gallery.html');
      nav.querySelector('#subNavBtn')?.addEventListener('click', () => window.location.href = 'gallery.html?subscribe=1');
      nav.querySelector('#adminNavBtn')?.addEventListener('click', () => window.location.href = 'admin.html');
      nav.querySelector('#logoutNavBtn')?.addEventListener('click', () => { if (confirm('خارج بشی؟')) { localStorage.removeItem(CURRENT_KEY); window.location.href = 'home.html'; } });
    }

    // 🔥 دریافت زنده دیتا از فایربیس (هر لحظه کاربر جدیدی اضافه شد، نشون بده)
    window.renderUsersFromCloud = function(cloudUsers) {
      let updatedUsers = cloudUsers.filter(u => u.email !== ADMIN_EMAIL);
      updatedUsers.push(adminData); // اضافه کردن اجباری مدیر
      
      users = updatedUsers;
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
      renderUsers();
      updateStats();
    };

    renderUsers(); updateStats(); renderBottomNav();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCdy1XEUDrVdgmyrr2r5nnvxaIP6A6y294",
      authDomain: "navaa-409cb.firebaseapp.com",
      projectId: "navaa-409cb",
      storageBucket: "navaa-409cb.firebasestorage.app",
      messagingSenderId: "81312395623",
      appId: "1:81312395623:web:6dd187fdf063ce44fc3fc2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    onSnapshot(doc(db, 'navaa_storage', 'navaa_users'), (docSnap) => {
      if (docSnap.exists()) {
        const cloudUsers = JSON.parse(docSnap.data().value);
        if (typeof window.renderUsersFromCloud === 'function') window.renderUsersFromCloud(cloudUsers);
      }
    });
  </script>
</body>
</html>
