<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navaa | جایی که هنر به صدا درمیاد</title>
  
  <!-- 🔥 لوگوی سایت -->
  <link rel="icon" type="image/png" href="favicon.png">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { margin: 0; padding: 0; background: var(--black); color: #fff; font-family: inherit; display: flex; flex-direction: column; min-height: 100vh; }
    header { padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .logo-box { display: flex; align-items: center; gap: .5rem; text-decoration: none; color: #fff; font-size: 1.5rem; font-weight: 800; }
    .header-actions { display: flex; gap: 1rem; }
    .btn-outline { background: transparent; border: 1.5px solid rgba(255,255,255,0.2); color: #fff; padding: .6rem 1.2rem; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: .9rem; transition: .3s; }
    .btn-outline:hover { border-color: #fff; }
    .btn-primary { background: linear-gradient(135deg, var(--turquoise), var(--sky)); color: #001a1c; padding: .6rem 1.2rem; border-radius: 999px; text-decoration: none; font-weight: 800; font-size: .9rem; box-shadow: 0 0 15px rgba(0,240,212,0.4); transition: .3s; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(0,240,212,0.6); }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    h1 { font-size: 3rem; font-weight: 900; margin-bottom: 1rem; line-height: 1.3; background: linear-gradient(90deg, #00f0d4, #ffc93c, #ff2e4d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p.subtitle { font-size: 1.1rem; color: var(--text-dim); max-width: 600px; line-height: 1.8; margin-bottom: 2.5rem; }
    
    /* ✅ دکمه شروع */
    .btn-start { background: linear-gradient(135deg, var(--turquoise), var(--sky)); color: #001a1c; padding: 1rem 3rem; border-radius: 999px; text-decoration: none; font-weight: 800; font-size: 1.1rem; box-shadow: 0 0 30px rgba(0,240,212,0.5); transition: .3s; margin-bottom: 4rem; display: inline-block; }
    .btn-start:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 0 40px rgba(0,240,212,0.8); }
    
    .features { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
    .feature-card { background: #111; border: 1px solid rgba(255,255,255,0.05); padding: 1.5rem; border-radius: 20px; width: 180px; transition: .3s; }
    .feature-card:hover { border-color: var(--turquoise); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,240,212,0.1); }
    .feature-icon { font-size: 2rem; margin-bottom: 1rem; }
    .feature-title { font-weight: 700; font-size: 0.95rem; color: #fff; }
    footer { text-align: center; padding: 2rem; color: var(--text-dim); font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <a href="home.html" class="logo-box"><span>🎵</span><span>Navaa<span style="color:var(--turquoise);">.</span></span></a>
    <div class="header-actions">
      <a href="login.html" class="btn-outline">ورود به حساب</a>
      <a href="login.html" class="btn-primary">ساخت حساب</a>
    </div>
  </header>
  <main>
    <h1>جایی که هنر به صدا درمیاد</h1>
    <p class="subtitle">آثار هنری، موسیقی و طراحی خودت رو با دنیا به اشتراک بذار. کشف کن، الهام بگیر، و خلق کن.</p>
    
    <!-- ✅ دکمه شروع به لاگین وصل شد -->
    <a href="login.html" class="btn-start">🚀 شروع کن</a>
    
    <div class="features">
      <div class="feature-card"><div class="feature-icon">✨</div><div class="feature-title">الهام روزانه</div></div>
      <div class="feature-card"><div class="feature-icon">📸</div><div class="feature-title">عکاسی هنری</div></div>
      <div class="feature-card"><div class="feature-icon">🎵</div><div class="feature-title">موسیقی و صدا</div></div>
      <div class="feature-card"><div class="feature-icon">🎨</div><div class="feature-title">نقاشی و طراحی</div></div>
    </div>
  </main>
  <footer>🎵 Navaa — ساخته‌شده با ❤️ برای هنرمندان</footer>
</body>
</html>س
